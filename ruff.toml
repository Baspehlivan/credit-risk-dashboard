[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length — handled by formatter
    "E402",   # module-level import not at top — common in scripts/streamlit
    "F541",   # f-string without placeholders — harmless
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
